name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore

  integration-test:
    name: Integration Tests (${{ matrix.os }} / ${{ matrix.browser }})
    needs: unit-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core browser matrix — runs lifecycle + v0.10-remote suites.
          - os: ubuntu-latest
            browser: chrome
          - os: ubuntu-latest
            browser: firefox
          - os: windows-latest
            browser: chrome
          - os: windows-latest
            browser: edge
          - os: windows-latest
            browser: firefox
          # Safari only exists on macOS (safaridriver ships with macOS).
          # Runs the v0.10-remote suite (lifecycle's CDP/emulation tests
          # are not supported by safaridriver).
          - os: macos-latest
            browser: safari
    env:
      SE_CLI_E2E: '1'
      SE_CLI_TEST_CHROME: ${{ matrix.browser == 'chrome' && '1' || '' }}
      SE_CLI_TEST_EDGE: ${{ matrix.browser == 'edge' && '1' || '' }}
      SE_CLI_TEST_FIREFOX: ${{ matrix.browser == 'firefox' && '1' || '' }}
      SE_CLI_TEST_SAFARI: ${{ matrix.browser == 'safari' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc

      # Install Firefox browser when needed (geckodriver is handled
      # by selenium-webdriver's built-in Selenium Manager).
      - name: Install Firefox (Linux)
        if: runner.os == 'Linux' && matrix.browser == 'firefox'
        id: firefox-linux
        uses: browser-actions/setup-firefox@v1.7.2
        with:
          firefox-version: latest
      - name: Install Firefox (Windows)
        if: runner.os == 'Windows' && matrix.browser == 'firefox'
        id: firefox-win
        uses: browser-actions/setup-firefox@v1.7.2
        with:
          firefox-version: latest

      # NOTE: do NOT run `sudo safaridriver --enable` here. On the
      # macos-26 arm64 runner image it registers a persistent
      # safaridriver LaunchDaemon that pairs Safari immediately, so the
      # selenium-webdriver-spawned safaridriver fails with "already
      # paired with another WebDriver session". The runner image already
      # authorizes WebDriver automation; selenium spawns its own
      # safaridriver process instead.

      # The safari job runs the v0.10-remote suite plus the safari and
      # grid suites: lifecycle exercises CDP/emulation features that
      # safaridriver does not support, so it stays out of the safari job.
      # The grid suite's real-remote tests use a locally spawned
      # chromedriver as a Grid-node-equivalent endpoint (macOS runners
      # ship Chrome), and its mock-hub tests run anywhere.
      - name: Run integration tests (Safari)
        if: matrix.browser == 'safari'
        id: integration-test-safari
        run: npx vitest run tests/integration/v0.10-remote.test.ts tests/integration/v0.10-safari.test.ts tests/integration/v0.10-grid.test.ts
      - name: Run integration tests
        if: matrix.browser != 'safari'
        id: integration-test
        env:
          SE_FIREFOX_BINARY: ${{ matrix.browser == 'firefox' && (runner.os == 'Linux' && steps.firefox-linux.outputs.firefox-path || steps.firefox-win.outputs.firefox-path) || '' }}
        run: npx vitest run tests/integration/lifecycle.test.ts tests/integration/v0.10-remote.test.ts tests/integration/v0.10-grid.test.ts

      # Retry integration tests once on failure — browser driver crashes
      # (e.g. Windows chromedriver 0xC0000142) are often transient.
      - name: Retry integration tests on failure (Safari)
        if: failure() && steps.integration-test-safari.outcome == 'failure'
        run: npx vitest run tests/integration/v0.10-remote.test.ts tests/integration/v0.10-safari.test.ts tests/integration/v0.10-grid.test.ts
      - name: Retry integration tests on failure
        if: failure() && steps.integration-test.outcome == 'failure'
        env:
          SE_FIREFOX_BINARY: ${{ matrix.browser == 'firefox' && (runner.os == 'Linux' && steps.firefox-linux.outputs.firefox-path || steps.firefox-win.outputs.firefox-path) || '' }}
        run: npx vitest run tests/integration/lifecycle.test.ts tests/integration/v0.10-remote.test.ts tests/integration/v0.10-grid.test.ts
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.browser }}
          path: .se-cli/
          if-no-files-found: ignore
