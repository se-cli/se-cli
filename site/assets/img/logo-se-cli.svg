<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 128" width="440" height="128" role="img" aria-label="se-cli logo">
  <!-- Primary logo for light backgrounds: green icon + wordmark -->
  <!-- Icon: green rounded square + white >_ -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#22C55E"/>
  <path d="M36 42 L62 64 L36 86" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="70" y1="86" x2="90" y2="86" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- Wordmark: se- (dark) + cli (green) -->
  <text x="140" y="88" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="60" font-weight="700" letter-spacing="-1">
    <tspan fill="#111827">se-</tspan><tspan fill="#22C55E">cli</tspan>
  </text>
</svg>
