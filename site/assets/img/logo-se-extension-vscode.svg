<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 128" width="440" height="128" role="img" aria-label="se-extension-vscode logo">
  <!-- Primary logo for light backgrounds: green icon + wordmark -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#22C55E"/>
  <!-- VS Code blue angle bracket left < -->
  <path d="M30 44 L20 64 L30 84" fill="none" stroke="#007ACC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Prompt caret > -->
  <path d="M38 46 L56 64 L38 82" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Underscore cursor _ -->
  <line x1="60" y1="82" x2="76" y2="82" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- VS Code blue angle bracket right > -->
  <path d="M86 44 L96 64 L86 84" fill="none" stroke="#007ACC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark: se- (dark) + extension (green) + -vscode (blue) -->
  <text x="140" y="88" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#111827">se-</tspan><tspan fill="#22C55E">extension</tspan><tspan fill="#007ACC">-vscode</tspan>
  </text>
</svg>